<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Do not edit head container -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="dash-header">
        <img src="assets/logos/logo.jpg" alt="logo">

        <input type="text" placeholder="Search">

        <img src="assets/avatar/man.jpg" alt="man">
    </header>


    <!-- Dashboard Wrapper -->
    <div class="dash-wrapper">

        <!-- Sidebar -->
        <aside class="sidebar">
            <ul>
                <li>Dashboard</li>
                <li>Analytics</li>
                <li>Projects</li>
                <li>Settings</li>
            </ul>

            <!-- '#' keeps it as a working link without needing a real destination -->
            <a href="#">Logout</a>
        </aside>


        <!-- Main Content -->
        <main class="dash-content">

            <!-- Statistics Cards -->
            <section class="stats-grid">

                <article class="card">
                    <h3>Daily Users</h3>
                    <em>12,000</em>
                    <p>12% User Growth</p>
                </article>

                <article class="card">
                    <h3>Daily Users</h3>
                    <em>12,000</em>
                    <p>12% User Growth</p>
                </article>

                <article class="card">
                    <h3>Daily Users</h3>
                    <em>12,000</em>
                    <p>12% User Growth</p>
                </article>

                <article class="card">
                    <h3>Daily Users</h3>
                    <em>12,000</em>
                    <p>12% User Growth</p>
                </article>

            </section>


            <!-- Projects and Activity -->
            <section class="body-split">

                <!-- Projects -->
                <div class="project-container">
                    <img src="assets/images/project1.jpg" alt="Project 1">
                    <img src="assets/images/project2.jpg" alt="Project 2">
                </div>

                <!-- Activity -->
                <div class="activity-container">
                    <h3>Phil</h3>
                    <h3>Complete the project</h3>
                    <h3>at 2.50pm</h3>
                </div>

            </section>

        </main>

    </div>


    <!-- Footer -->
    <footer class="dash-footer">
        <p>&copy; 2026 CCT360 Analytics Portal - Midterm Exam</p>
    </footer>

</body>

</html>
